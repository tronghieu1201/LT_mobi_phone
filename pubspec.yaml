name: doan_mobi
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

  # Firebase & Provider
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3  # Thêm để hỗ trợ upload ảnh lên Firebase (nếu cần ở view_user)
  provider: ^6.1.2

  # Format phone number, dates, currency, etc.
  intl: ^0.19.0

  # Google Maps
  google_maps_flutter: ^2.7.0

  # Geolocator cho vị trí hiện tại
  geolocator: ^10.1.0

  # Geocoding cho tìm kiếm địa chỉ
  geocoding: ^3.0.0

  # Image picker và path provider cho upload ảnh (dùng ở view_user, hỗ trợ web cơ bản)
  image_picker: ^1.1.2  # Latest stable
  path_provider: ^2.1.4  # Latest stable

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets cho hình ảnh QR và các file khác
  assets:
    - assets/img/

  # To add custom fonts, uncomment and configure:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700