name: doan_mobi
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0  # ⚙️ Cập nhật lên ^3.8.0 để tương thích với Dart mới nhất (Flutter 3.30+ dự kiến vào 2025)

dependencies:
  flutter:
    sdk: flutter

  # Giao diện iOS
  cupertino_icons: ^1.0.8  # Giữ nguyên (mới nhất)

  # Mở liên kết ngoài (trình duyệt, điện thoại, mail...)
  url_launcher: ^6.3.2  # Giữ nguyên (mới nhất)

  # Firebase & Provider
  firebase_core: ^4.2.0  # Cập nhật từ 3.6.0
  firebase_auth: ^6.1.1  # Cập nhật từ 5.3.1
  cloud_firestore: ^6.0.3  # Cập nhật từ 5.4.4
  firebase_storage: ^13.0.3  # Cập nhật từ 12.3.3
  provider: ^6.1.5+1  # Cập nhật từ 6.1.2

  # SỬA: Downgrade về ^6.2.1 (stable, tránh breaking changes v7)
  google_sign_in: ^6.2.1

  # Định dạng số, tiền tệ, ngày giờ
  intl: ^0.20.2  # Cập nhật từ 0.19.0

  # Google Maps
  google_maps_flutter: ^2.13.1  # Cập nhật từ 2.7.0

  # Vị trí hiện tại
  geolocator: ^14.0.2  # Cập nhật từ 10.1.0

  # Chuyển đổi giữa toạ độ và địa chỉ
  geocoding: ^4.0.0  # Cập nhật từ 3.0.0

  # Chọn ảnh từ thư viện / camera và truy xuất đường dẫn file
  image_picker: ^1.2.0  # Cập nhật từ 1.1.2
  path_provider: ^2.1.5  # Cập nhật từ 2.1.4

  # HTTP cho chatbot API
  http: ^1.5.0  # Cập nhật từ 1.2.2

  # Lưu trữ local (thêm để hỗ trợ SharedPreferences)
  shared_preferences: ^2.5.3  # Phiên bản mới nhất (tính đến 2025)

  # THÊM: Để hỗ trợ chọn file trong view_ad_home.dart
  file_picker: ^6.1.1  # Phiên bản ổn định mới nhất (cập nhật theo yêu cầu code)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  # Cập nhật từ 5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
